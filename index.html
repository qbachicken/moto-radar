<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoRadar Skierniewice</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: #131b2e;
            --card-border: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --accent-green: #10b981;
            --primary: #3b82f6;
            --ai-purple: #8b5cf6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 90px;
        }
        header {
            background: #0f172a;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        h1 { margin: 0; font-size: 1.2rem; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
        h1 span { color: var(--accent-red); }
        .btn-settings {
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid #334155;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .container { padding: 16px; max-width: 600px; margin: auto; }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .card h3 { margin-top: 0; font-size: 1rem; color: #fff; margin-bottom: 10px; }
        .card textarea, .card input[type="text"], .card input[type="password"] {
            background: #0f172a;
            color: white;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            font-size: 0.9rem;
        }
        .btn-ai {
            background: var(--ai-purple);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            font-size: 0.9rem;
            margin-top: 8px;
        }
        .btn-ai:hover { background: #7c3aed; }
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .filters::-webkit-scrollbar { display: none; }
        .filter-btn {
            background: #1e293b;
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            padding: 8px 14px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .event-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.1s;
        }
        .event-card:active { border-color: var(--primary); transform: scale(0.995); }
        .event-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
        .event-title { font-size: 1.1rem; font-weight: 600; color: #fff; margin: 8px 0 8px 0; line-height: 1.4; word-break: break-word; white-space: normal; }
        .badge { font-size: 0.7rem; padding: 4px 8px; border-radius: 6px; font-weight: 600; text-transform: uppercase; }
        .badge.subcat { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .badge.star-badge { background: rgba(245, 158, 11, 0.15); color: #fbbf24; margin-left: 6px; }
        .badge.ai-badge { background: rgba(139, 92, 246, 0.15); color: #c4b5fd; margin-left: 6px; }
        .star-btn {
            background: none; border: none; font-size: 1.6rem; cursor: pointer; color: #475569; padding: 0; line-height: 1;
        }
        .star-btn.active { color: var(--accent-yellow); text-shadow: 0 0 10px rgba(245,158,11,0.4); }
        .event-footer {
            display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid #1e293b; padding-top: 10px; margin-top: 10px;
        }
        .event-footer .loc { color: var(--accent-green); font-weight: 500; }

        .event-details {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #334155;
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .event-card.expanded .event-details {
            display: block;
        }
        .btn-source {
            display: inline-block;
            margin-top: 12px;
            background: #1e293b;
            color: #60a5fa;
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 600;
        }
        .btn-source:hover { background: #334155; color: #fff; }

        /* Modal Popup */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal {
            background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px;
            padding: 20px; width: 85%; max-width: 340px; text-align: center;
        }
        .modal h3 { margin-top: 0; color: #fff; font-size: 1.1rem; }
        .modal p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; word-break: break-all; }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-btn {
            flex: 1; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; font-size: 0.9rem;
        }
        .modal-btn.yes { background: var(--primary); color: white; }
        .modal-btn.no { background: #1e293b; color: var(--text-main); border: 1px solid #334155; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 0.95rem; }
    </style>
</head>
<body>

<header>
    <h1>Moto<span>Radar</span></h1>
    <button class="btn-settings" onclick="toggleSettings()">⚙️ Ustawienia</button>
</header>

<div class="container">
    <div id="settingsPanel" class="card" style="display: none;">
        <h3>Ustawienia i AI</h3>
        <label style="font-size: 0.85rem; color: var(--text-muted);">Maks. odległość (km):</label>
        <input type="number" id="maxDist" value="150" onchange="saveSettings()" style="background:#0f172a; color:#fff; border:1px solid #334155; padding:8px; border-radius:6px; width:100%; margin-top:4px; margin-bottom:12px;">

        <label style="font-size: 0.85rem; color: var(--text-muted);">Klucz API Groq (dla czyszczenia AI):</label>
        <input type="password" id="groqKeyInput" placeholder="gsk_..." onchange="saveGroqKey()" style="background:#0f172a; color:#fff; border:1px solid #334155; padding:8px; border-radius:6px; width:100%; margin-top:4px;">
        <small style="color: var(--text-muted); display: block; margin-top: 4px;">Klucz zapisuje się wyłącznie w Twojej przeglądarce (localStorage).</small>

        <button class="btn-ai" onclick="runGroqAIOptimization()" style="margin-top: 12px;">✨ Usprawnij wydarzenia przez Groq AI</button>
    </div>

    <div class="card">
        <h3>➕ Dodaj wydarzenie</h3>
        <textarea id="fbPaste" placeholder="Wklej nazwę, datę i miejscowość..." rows="2"></textarea>
        <button class="btn-primary" onclick="addFromFacebook()">Dodaj do bazy</button>
    </div>

    <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all', this)">Wszystkie</button>
        <button class="filter-btn" onclick="setFilter('starred', this)">⭐ Ważne</button>
        <button class="filter-btn" onclick="setFilter('Rajd Przeprawowy / Trophy', this)">🚜 Rajdy</button>
        <button class="filter-btn" onclick="setFilter('Wyprawa Turystyczna / 4x4', this)">🧭 Wyprawy</button>
        <button class="filter-btn" onclick="setFilter('Szkolenie / Trening', this)">🎓 Szkolenia</button>
        <button class="filter-btn" onclick="setFilter('Tor / Wyścig / Time Attack', this)">🏁 Tory</button>
        <button class="filter-btn" onclick="setFilter('Zlot / Spot / Spotkanie', this)">🚗 Zloty</button>
    </div>

    <div id="eventsList">Ładowanie...</div>
</div>

<!-- Modal Popup -->
<div id="sourceModal" class="modal-overlay">
    <div class="modal">
        <h3>Otworzyć źródło?</h3>
        <p id="modalEventTitle">Czy chcesz przejść do oficjalnej strony tego wydarzenia?</p>
        <div class="modal-buttons">
            <button class="modal-btn no" onclick="closeModal()">Nie</button>
            <button class="modal-btn yes" onclick="confirmOpenSource()">Tak, otwórz</button>
        </div>
    </div>
</div>

<script>
    let events = [];
    let settings = JSON.parse(localStorage.getItem('motoradar_settings') || '{"maxDist": 150}');
    let groqApiKey = localStorage.getItem('motoradar_groq_key') || '';
    let currentFilter = 'all';
    let pendingUrl = '';

    document.getElementById('maxDist').value = settings.maxDist;
    document.getElementById('groqKeyInput').value = groqApiKey;

    function toggleSettings() {
        let p = document.getElementById('settingsPanel');
        p.style.display = p.style.display === 'none' ? 'block' : 'none';
    }

    function saveSettings() {
        settings.maxDist = parseInt(document.getElementById('maxDist').value) || 150;
        localStorage.setItem('motoradar_settings', JSON.stringify(settings));
        renderEvents();
    }

    function saveGroqKey() {
        groqApiKey = document.getElementById('groqKeyInput').value.trim();
        localStorage.setItem('motoradar_groq_key', groqApiKey);
        alert('Klucz Groq API został zapisany lokalnie!');
    }

    function normalizeTitle(title) {
        return (title || '').toLowerCase().replace(/[\W_]+/g, '');
    }

    async function loadEvents() {
        try {
            let res = await fetch('events.json?_=' + Date.now());
            let data = await res.json();
            let localCustom = JSON.parse(localStorage.getItem('motoradar_custom') || '[]');
            localStorage.removeItem('motoradar_ai_optimized');

            let combined = [...localCustom, ...data];
            let approxRegions = ["Jura", "Wał Pomorski", "Śląsk", "Zagłębie", "Jurajskie", "Gorce", "Spisz", "Kotlina Jeleniogórska", "Sudeckie", "Pomorski", "Lubuski", "Świętokrzyskie", "Pustynia Siedlecka", "Pustynia Błędowska"];
            let uniqueEvents = [];
            for (let ev of combined) {
                if (ev.subCategory === "Rajd / Offroad" || ev.subCategory === "Rajd") {
                    ev.subCategory = "Rajd Przeprawowy / Trophy";
                } else if (ev.subCategory === "Zlot / Spot" || ev.subCategory === "Zlot") {
                    ev.subCategory = "Zlot / Spot / Spotkanie";
                }
                if ((!ev.location || ev.location === "Nieznana") && ev.distanceKm === 0) {
                    ev.distanceKm = null;
                    ev.locationType = "unknown";
                }
                if (!ev.locationType) {
                    if (!ev.location || ev.location === "Nieznana") {
                        ev.locationType = "unknown";
                        ev.distanceKm = null;
                    } else if (approxRegions.includes(ev.location)) {
                        ev.locationType = "approximate";
                    } else {
                        ev.locationType = "exact";
                    }
                }
                let normT = normalizeTitle(ev.title);
                let d = (ev.date || '').trim().toLowerCase();
                let dup = uniqueEvents.find(existing => {
                    let exNormT = normalizeTitle(existing.title);
                    let exD = (existing.date || '').trim().toLowerCase();
                    return d === exD && (normT === exNormT || normT.includes(exNormT) || exNormT.includes(normT));
                });
                if (!dup) {
                    uniqueEvents.push(ev);
                } else {
                    if ((ev.fullDescription || '').length > (dup.fullDescription || '').length) {
                        dup.fullDescription = ev.fullDescription;
                    }
                    if (ev.source && !dup.source) {
                        dup.source = ev.source;
                    }
                }
            }
            events = uniqueEvents;
            renderEvents();
        } catch (e) {
            document.getElementById('eventsList').innerHTML = '<div class="empty-state">Błąd pobierania danych.</div>';
        }
    }

    function setFilter(filter, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = filter;
        renderEvents();
    }

    function toggleStar(event, index) {
        event.stopPropagation();
        events[index].starred = !events[index].starred;
        if (events[index].starred) {
            playAlertSound();
        }
        saveCurrentEventsState();
        renderEvents();
    }

    function saveCurrentEventsState() {
        localStorage.setItem('motoradar_custom', JSON.stringify(events.filter(e => e.custom)));
        localStorage.setItem('motoradar_ai_optimized', JSON.stringify(events));
    }

    function playAlertSound() {
        try {
            let ctx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = ctx.createOscillator();
            let gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        } catch (e) {}
    }

    function toggleExpand(cardElement) {
        cardElement.classList.toggle('expanded');
    }

    function openSourceModal(event, title, url) {
        event.stopPropagation();
        pendingUrl = url || 'https://klasyki24.pl';
        document.getElementById('modalEventTitle').innerText = "Otworzyć stronę źródłową dla:\n" + title;
        document.getElementById('sourceModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('sourceModal').style.display = 'none';
        pendingUrl = '';
    }

    function confirmOpenSource() {
        if (pendingUrl) {
            window.open(pendingUrl, '_blank');
        }
        closeModal();
    }

    async function runGroqAIOptimization() {
        if (!groqApiKey) {
            alert('Najpierw wpisz i zapisz swój klucz Groq API w ustawieniach!');
            toggleSettings();
            return;
        }

        let btn = document.querySelector('.btn-ai');
        btn.innerText = "⏳ Groq AI porządkuje i deduplikuje...";
        btn.disabled = true;

        try {
            let rawList = events.map((e, i) => ({
                id: i,
                title: e.title,
                date: e.date,
                location: e.location,
                desc: e.fullDescription || e.title,
                source: e.source
            }));

            let prompt = `Jesteś głównym asystentem AI aplikacji motoryzacyjnej MotoRadar. Otrzymujesz listę surowych wydarzeń motoryzacyjnych zebranych z wielu różnych kalendarzy. Twoim zadaniem jest:
1. Usunąć duplikaty (jeśli to samo wydarzenie występuje w różnych źródłach dla tej samej daty i miasta, zostaw tylko JEDNą najlepszą pozycję).
2. Odrzucić wydarzenia spamowe lub niebędące motoryzacyjnymi.
3. Dla każdego unikalnego wydarzenia przygotować czysty, profesjonalny i chwytliwy tytuł ("cleanTitle", max 45 znaków) oraz zwięzły opis ("cleanDesc", 1-2 zdania po polsku).

Zwróć wynik WYŁĄCZNIE jako tablicę JSON w formacie:
[
  {
    "originalIds": [0, 2],
    "cleanTitle": "...",
    "cleanDesc": "...",
    "date": "...",
    "location": "...",
    "subCategory": "Jedna z 5 dokładnych podkategorii: Rajd Przeprawowy / Trophy, Wyprawa Turystyczna / 4x4, Szkolenie / Trening, Tor / Wyścig / Time Attack, Zlot / Spot / Spotkanie",
    "source": "..."
  },
  ...
]

Oto dane wejściowe:
` + JSON.stringify(rawList);

            let response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${groqApiKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        { role: "system", content: "You are a precise JSON-only data cleaning and deduplication assistant." },
                        { role: "user", content: prompt }
                    ],
                    temperature: 0.1
                })
            });

            let result = await response.json();
            let content = result.choices[0].message.content;

            let jsonMatch = content.match(/\[[\s\S]*\]/);
            if (jsonMatch) {
                let cleanedData = JSON.parse(jsonMatch[0]);

                let newEvents = cleanedData.map(item => {
                    // Try to preserve original distance/coords if matched
                    let orig = events[item.originalIds?.[0]] || events[0];
                    let subCat = item.subCategory || orig.subCategory || "Zlot / Spot";
                    let isOffroad = /rajd|offroad|4x4|teren|cross/i.test(item.cleanTitle + " " + item.cleanDesc);

                    return {
                        title: item.cleanTitle,
                        fullDescription: item.cleanDesc,
                        subCategory: isOffroad ? "Rajd / Offroad" : subCat,
                        location: item.location || orig.location || "Okolica",
                        distanceKm: orig.distanceKm || 25,
                        autoStarred: isOffroad,
                        starred: isOffroad || orig.starred,
                        date: item.date || orig.date || "Wkrótce",
                        source: item.source || orig.source || "https://klasyki24.pl",
                        aiOptimized: true
                    };
                });

                events = newEvents;
                saveCurrentEventsState();
                renderEvents();
                alert(`Groq AI pomyślnie oczyścił listę! Usunięto duplikaty, zostawiając ${events.length} unikalnych wydarzeń.`);
            } else {
                throw new Error("Nie udało się sparsować odpowiedzi JSON z Groq.");
            }
        } catch (err) {
            console.error(err);
            alert('Błąd podczas optymalizacji Groq AI: ' + err.message);
        } finally {
            btn.innerText = "✨ Usprawnij wydarzenia przez Groq AI";
            btn.disabled = false;
        }
    }

    function renderEvents() {
        let list = document.getElementById('eventsList');
        let filtered = events.filter(e => {
            if (e.distanceKm > settings.maxDist) return false;
            if (currentFilter === 'starred' && !e.starred && !e.autoStarred) return false;
            if (currentFilter !== 'all' && currentFilter !== 'starred' && e.subCategory !== currentFilter) return false;
            return true;
        });

        if (filtered.length === 0) {
            list.innerHTML = '<div class="empty-state">Brak wydarzeń w wybranym promieniu.</div>';
            return;
        }

        list.innerHTML = filtered.map((e, idx) => {
            let realIdx = events.indexOf(e);
            let isStarred = e.starred || e.autoStarred;
            let safeTitle = (e.title || '').replace(/'/g, "\\'");
            let desc = e.fullDescription || e.title || 'Brak dodatkowego opisu.';
            return `
                <div class="event-card" onclick="toggleExpand(this)">
                    <div class="event-header">
                        <div>
                            <span class="badge subcat">${e.subCategory || 'Zlot'}</span>
                            ${isStarred ? '<span class="badge star-badge">⭐ Priorytet</span>' : ''}
                            ${e.aiOptimized ? '<span class="badge ai-badge">✨ AI</span>' : ''}
                        </div>
                        <button class="star-btn ${isStarred ? 'active' : ''}" onclick="toggleStar(event, ${realIdx})">⭐</button>
                    </div>
                    <div class="event-title">${e.title}</div>
                    <div class="event-footer">
                        <span>📅 ${e.date || 'Wkrótce'}</span>
                        <span class="loc">📍 ${e.location === 'Nieznana' ? 'Nieznana lokalizacja' : (e.location || 'Okolica') + ' / ' + e.distanceKm + ' km'}</span>
                    </div>
                    <div class="event-details">
                        <p style="margin: 0 0 10px 0; color: #94a3b8; font-size: 0.85rem;">Szczegóły wydarzenia:</p>
                        <p style="margin: 0;">${desc}</p>
                        <button class="btn-source" onclick="openSourceModal(event, '${safeTitle}', '${e.source || ''}')">🔗 Otwórz stronę źródłową</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function addFromFacebook() {
        let text = document.getElementById('fbPaste').value.trim();
        if (!text) return;
        let lines = text.split('\n').map(l => l.trim()).filter(Boolean);
        let title = lines[0] || "Wydarzenie z własnego wpisu";
        let isOffroad = /rajd|offroad|4x4|teren|cross/i.test(text);

        let custom = JSON.parse(localStorage.getItem('motoradar_custom') || '[]');
        let normTitle = normalizeTitle(title);
        let exists = custom.some(e => normalizeTitle(e.title) === normTitle) || events.some(e => normalizeTitle(e.title) === normTitle);
        if (exists) {
            alert('To wydarzenie znajduje się już w bazie!');
            document.getElementById('fbPaste').value = '';
            return;
        }

        let newEv = {
            title: title,
            fullDescription: text,
            subCategory: isOffroad ? "Rajd / Offroad" : "Zlot / Spot",
            location: "Skierniewice",
            distanceKm: 0,
            autoStarred: isOffroad,
            starred: isOffroad,
            date: "Najbliższy termin",
            custom: true,
            source: "https://facebook.com"
        };
        custom.push(newEv);
        localStorage.setItem('motoradar_custom', JSON.stringify(custom));
        document.getElementById('fbPaste').value = '';
        loadEvents();
    }

    loadEvents();
</script>
</body>
</html>
